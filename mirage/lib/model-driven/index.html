<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="mirage-csrf" content="__MIRAGE_CSRF__" />
    <meta name="mirage-trace-id" content="__MIRAGE_TRACE_ID__" />
    <meta name="mirage-trace-parent" content="__MIRAGE_TRACE_PARENT__" />
    <title>Mirage Apps</title>
    <link rel="stylesheet" href="/_apps/assets/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Cpath d=%27M0 0h3v3H0zm6 0h3v3H6zm6 0h3v3h-3zM0 6h3v3H0zm6 0h3v3H6zm6 0h3v3h-3zM0 12h3v3H0zm6 0h3v3H6zm6 0h3v3h-3z%27/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <a class="skip" href="#workspace">Skip to main content</a>
    <header class="global">
      <button id="mobile-navigation" data-icon="menu" aria-label="Toggle navigation" aria-expanded="false"></button
      ><span class="waffle" aria-hidden="true"
        ><svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor">
          <path
            d="M0 0h3v3H0zm6 0h3v3H6zm6 0h3v3h-3zM0 6h3v3H0zm6 0h3v3H6zm6 0h3v3h-3zM0 12h3v3H0zm6 0h3v3H6zm6 0h3v3h-3z"
          /></svg></span
      ><strong>Mirage Apps</strong><span class="divider"></span
      ><button id="apps" aria-label="Application" aria-haspopup="dialog" aria-expanded="false" disabled>
        <span>Loading application…</span></button
      ><span class="global-spacer"></span
      ><button
        data-icon="search"
        disabled
        title="Global search is not supported locally"
        aria-label="Global search"
      ></button
      ><button data-icon="add" disabled title="Quick create is not supported locally" aria-label="Quick create"></button
      ><button
        data-icon="filter"
        disabled
        title="Advanced Find is not supported locally"
        aria-label="Advanced Find"
      ></button
      ><button
        data-icon="settings"
        disabled
        title="Classic advanced settings are not supported locally"
        aria-label="Advanced settings"
      ></button
      ><button data-icon="help" disabled title="Product help is not available locally" aria-label="Help"></button
      ><button
        id="global-more"
        data-icon="more"
        disabled
        aria-label="More global commands"
        title="Additional global commands are not supported locally."
      ></button
      ><button id="staff-profile" aria-label="Staff profile" title="Staff profile">#</button>
    </header>
    <div class="local-bar">
      <span data-icon="info" aria-hidden="true"></span
      ><span>Mirage local environment (Power Apps compatible model-driven apps). Changes stay on this machine.</span
      ><span id="source-label" class="sr-only">Model-driven apps</span><a id="open-portal" href="/">Open portal</a
      ><a href="/_setup/">Setup</a>
    </div>
    <div class="shell">
      <aside id="sidebar">
        <button
          id="collapse"
          class="nav-toggle"
          data-icon="menu"
          aria-label="Toggle navigation"
          aria-expanded="true"
        ></button>
        <nav id="navigation" aria-label="Application navigation"></nav>
      </aside>
      <main id="workspace" tabindex="-1">
        <div id="commands" class="commands" role="toolbar" aria-label="Commands"></div>
        <div id="notice" role="status" aria-live="polite" hidden></div>
        <section id="content" aria-busy="true"><p class="loading">Loading application…</p></section>
      </main>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <script type="module" src="/_apps/assets/app.mjs"></script>
  </body>
</html>
