name: Feature request
description: Suggest reusable toolkit behavior or platform coverage.
labels: [enhancement]
body:
  - type: dropdown
    id: workflow
    attributes:
      label: Workflow
      options: [Lense, Mirage, Both, Installation or CLI, Documentation]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Paqvilo and online portal versions
      placeholder: 'Paqvilo 0.9.3; portal 9.x.x.x, Unknown or local only'
  - type: dropdown
    id: model
    attributes:
      label: Portal source and data model
      options: [Standard model (PAC paportal export), Enhanced model (PAC export), Code site / SPA (.powerpages-site), Mixed, Unknown or not applicable]
  - type: textarea
    id: problem
    attributes:
      label: Problem and desired outcome
      description: What task is difficult today? Describe the resulting behavior that would help.
    validations:
      required: true
  - type: textarea
    id: platform
    attributes:
      label: Platform components and export evidence
      description: Relevant Dataverse tables/metadata, forms/lists, Liquid, PCF, plugins, server logic, cloud flows, Power Automate or other Power Platform features. Explain whether behavior is derivable from exports or observed online. Use invented names.
  - type: textarea
    id: acceptance
    attributes:
      label: Example and acceptance criteria
      description: One small synthetic scenario that should work; optional workaround or alternative.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: This report contains no credentials, customer exports or live business data.
          required: true
