name: SonarQube
on:
  push:
    branches:
      - main
      # Release line: analysed so pull requests into it have a base to compare with.
      - 0.9.8
  pull_request:
    branches:
      - main
      - 0.9.8
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Serialize analyses of the same source branch, including multiple PRs.
  group: sonarqube-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  coverage:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    name: Coverage (${{ matrix.suite }}, ${{ matrix.lane }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: lense, lane: unit, shard: '', artifact: lense-unit }
          - { suite: lense, lane: browser, shard: '', artifact: lense-browser }
          - { suite: mirage, lane: unit, shard: '1/3', artifact: mirage-unit-1-of-3 }
          - { suite: mirage, lane: unit, shard: '2/3', artifact: mirage-unit-2-of-3 }
          - { suite: mirage, lane: unit, shard: '3/3', artifact: mirage-unit-3-of-3 }
          - { suite: mirage, lane: browser, shard: '1/2', artifact: mirage-browser-1-of-2 }
          - { suite: mirage, lane: browser, shard: '2/2', artifact: mirage-browser-2-of-2 }
          - { suite: examples, lane: unit, shard: '', artifact: examples-unit }
          - { suite: examples, lane: browser, shard: '', artifact: examples-browser }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            npm-shrinkwrap.json
            mirage/package-lock.json
      - name: Install the pinned .NET SDK
        if: matrix.suite != 'lense'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Prepare the existing test lane
        run: npm run ci:prepare -- --suite ${{ matrix.suite }} --${{ matrix.lane }} ${{ matrix.shard && format('--shard {0}', matrix.shard) || '' }}
      - name: Run the existing test lane with Node coverage
        env:
          NODE_V8_COVERAGE: ${{ runner.temp }}/paqvilo-v8-coverage
        run: |-
          mkdir -p "$NODE_V8_COVERAGE"
          npm run ci:verify -- --suite ${{ matrix.suite }} --${{ matrix.lane }} --prepared ${{ matrix.shard && format('--shard {0}', matrix.shard) || '' }}
      - name: Convert the collected process coverage to LCOV
        run: node node_modules/c8/bin/c8.js report --temp-directory "$RUNNER_TEMP/paqvilo-v8-coverage" --report-dir coverage --reporter lcov
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sonar-coverage-${{ matrix.artifact }}
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 1
  analysis:
    # Fork and Dependabot pull requests receive no repository secrets.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    needs: coverage
    name: SonarQube analysis and quality gate
    runs-on: ubuntu-24.04
    # Two sequential analyses use the same checked-out head and coverage.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Full history: blame decides which lines are new code.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: sonar-coverage-*
          path: coverage
      - name: Verify every coverage shard produced a report
        run: |-
          for report in \
            lense-unit lense-browser \
            mirage-unit-1-of-3 mirage-unit-2-of-3 mirage-unit-3-of-3 \
            mirage-browser-1-of-2 mirage-browser-2-of-2 \
            examples-unit examples-browser; do
            test -s "coverage/sonar-coverage-$report/lcov.info"
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - name: Install the locked analyzer type dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      # The community branch plugin needs explicit branch or pull request parameters.
      - name: Select the analysed branch or pull request
        id: target
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |-
          if [ "$EVENT" = pull_request ]; then
            args="-Dsonar.pullrequest.key=$PR_NUMBER -Dsonar.pullrequest.branch=$PR_BRANCH -Dsonar.pullrequest.base=$PR_BASE -Dsonar.scm.revision=$PR_SHA"
          else
            args="-Dsonar.branch.name=$BRANCH"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
      # Full-source branch analysis runs on the same checked-out PR head and coverage
      # before the existing pull-request new-code analysis. The branch name is the
      # actual source branch so reviewed Sonar issue dispositions remain attached.
      - name: Verify the full-source candidate checkout
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |-
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Analyze full source branch
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
            -Dsonar.javascript.lcov.reportPaths=coverage/sonar-coverage-lense-unit/lcov.info,coverage/sonar-coverage-lense-browser/lcov.info,coverage/sonar-coverage-mirage-unit-1-of-3/lcov.info,coverage/sonar-coverage-mirage-unit-2-of-3/lcov.info,coverage/sonar-coverage-mirage-unit-3-of-3/lcov.info,coverage/sonar-coverage-mirage-browser-1-of-2/lcov.info,coverage/sonar-coverage-mirage-browser-2-of-2/lcov.info,coverage/sonar-coverage-examples-unit/lcov.info,coverage/sonar-coverage-examples-browser/lcov.info
            -Dsonar.typescript.tsconfigPaths=.github/tsconfig.sonar.json
            -Dsonar.branch.name=${{ github.head_ref }}
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha }}
      - name: Require zero unresolved full-source findings
        if: github.event_name == 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_FULL_BRANCH: ${{ github.head_ref }}
          SONAR_EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
        run: node scripts/verify-sonar-branch.mjs
      - uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
            -Dsonar.javascript.lcov.reportPaths=coverage/sonar-coverage-lense-unit/lcov.info,coverage/sonar-coverage-lense-browser/lcov.info,coverage/sonar-coverage-mirage-unit-1-of-3/lcov.info,coverage/sonar-coverage-mirage-unit-2-of-3/lcov.info,coverage/sonar-coverage-mirage-unit-3-of-3/lcov.info,coverage/sonar-coverage-mirage-browser-1-of-2/lcov.info,coverage/sonar-coverage-mirage-browser-2-of-2/lcov.info,coverage/sonar-coverage-examples-unit/lcov.info,coverage/sonar-coverage-examples-browser/lcov.info
            -Dsonar.typescript.tsconfigPaths=.github/tsconfig.sonar.json
            ${{ steps.target.outputs.args }}
