# TEMPORARY: branch-only stress run to surface intermittent test failures. Remove before merge.
name: Stress

on:
  push:
    branches: [claude/upbeat-bell-ugjk02]

permissions:
  contents: read

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress:
    name: Stress (Node ${{ matrix.node }}, round ${{ matrix.round }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        round: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            npm-shrinkwrap.json
            mirage/package-lock.json
      - run: |
          npm ci --ignore-scripts
          npm ci --prefix mirage --ignore-scripts
          git config --global maintenance.auto false
          git config --global gc.auto 0
          node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Lense unit
        timeout-minutes: 5
        run: npm test
      - name: Mirage unit
        if: always()
        timeout-minutes: 5
        run: npm --prefix mirage run test
      - name: Lense browser x6
        if: always()
        timeout-minutes: 15
        env:
          PAQVILO_BROWSER: chromium
        run: |
          failed=0
          for i in 1 2 3 4 5 6; do
            if ! timeout 150 npm run test:browser > "lense-$i.log" 2>&1; then
              failed=$((failed+1))
              echo "::error::Lense browser iteration $i failed"
              grep -E "^. |not ok|timed out|agent-server steps|Error" "lense-$i.log" | grep -v "^✔" | head -60
            fi
          done
          echo "Lense browser failures: $failed/6"
          echo "Unanswered DevTools commands reported:"; grep -h "did not answer" lense-*.log || echo none
          [ "$failed" -eq 0 ]
      - name: Mirage browser x3
        if: always()
        timeout-minutes: 20
        env:
          PAQVILO_BROWSER: chromium
        run: |
          failed=0
          for i in 1 2 3; do
            if ! timeout 360 npm --prefix mirage run test:browser > "mirage-$i.log" 2>&1; then
              failed=$((failed+1))
              echo "::error::Mirage browser iteration $i failed"
              grep -E "not ok|timed out|Error|✖|ℹ" "mirage-$i.log" | head -60
            fi
          done
          echo "Mirage browser failures: $failed/3"
          [ "$failed" -eq 0 ]
