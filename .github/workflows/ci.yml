name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: '1'
  NPM_CONFIG_FUND: 'false'

jobs:
  changes:
    name: Change scope and commit convention
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      package: ${{ steps.scope.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Validate the squash commit title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/conventional-commit.mjs --title
      - name: Classify changes
        id: scope
        env:
          VALIDATE_ALL: ${{ inputs.ref != '' }}
        run: node .github/scripts/change-scope.mjs

  checks:
    needs: changes
    if: needs.changes.outputs.runtime == 'true' || needs.changes.outputs.package == 'true'
    name: Static checks and release boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            npm-shrinkwrap.json
            mirage/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix mirage --ignore-scripts
      - name: Check module syntax and project boundary
        if: needs.changes.outputs.runtime == 'true'
        run: npm run check
      - name: Validate distributable files, lockfiles and documentation
        run: npm run release:check
      - name: Audit production dependencies
        if: needs.changes.outputs.runtime == 'true'
        run: |
          npm audit --audit-level=moderate
          npm audit --prefix mirage --audit-level=moderate
      - name: Verify registry signatures of installed packages
        if: needs.changes.outputs.runtime == 'true'
        run: |
          npm audit signatures
          npm audit signatures --prefix mirage

  test:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    name: Tests (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            npm-shrinkwrap.json
            mirage/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix mirage --ignore-scripts
      # Tests create and copy temporary repositories; detached auto-maintenance races with those copies.
      - name: Disable Git auto-maintenance
        run: |
          git config --global maintenance.auto false
          git config --global gc.auto 0
      - name: Lense offline unit regressions
        run: npm test
      - name: Mirage offline unit regressions
        run: npm --prefix mirage run test
      - name: Install matching Chromium
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Lense loopback browser acceptance
        run: npm run test:browser
        env:
          PAQVILO_BROWSER: chromium
      - name: Mirage loopback browser acceptance
        run: npm --prefix mirage run test:browser
        env:
          PAQVILO_BROWSER: chromium
      - name: Collect only synthetic evidence
        if: always()
        run: node scripts/collect-evidence.mjs
      - name: Preserve synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence-node${{ matrix.node }}
          path: .paqvilo/ci-evidence-*/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  windows:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    name: Unit tests (Node 24, windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            npm-shrinkwrap.json
            mirage/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix mirage --ignore-scripts
      # Tests create and copy temporary repositories; detached auto-maintenance races with those copies.
      - name: Disable Git auto-maintenance
        run: |
          git config --global maintenance.auto false
          git config --global gc.auto 0
      - name: Lense offline unit regressions
        run: npm test
      - name: Mirage offline unit regressions
        run: npm --prefix mirage run test

  package:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    name: Package smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            npm-shrinkwrap.json
            mirage/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      # The smoke test installs the packed tarball offline, which needs registry metadata in the npm cache.
      - name: Prime npm cache for the offline install
        run: npm run cache:package
      - name: Install matching Chromium
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Install the packed distribution into the example project
        run: npm run release:smoke
        env:
          PAQVILO_BROWSER: chromium
      - name: Pack distributable
        run: mkdir -p dist && npm pack --ignore-scripts --pack-destination dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 14

  # Single required status check for branch protection.
  gate:
    name: CI gate
    if: always()
    needs: [changes, checks, test, windows, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          SCOPE_RESULT: ${{ needs.changes.result }}
          RUNTIME: ${{ needs.changes.outputs.runtime }}
          PACKAGE: ${{ needs.changes.outputs.package }}
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.test.result }}
          WINDOWS: ${{ needs.windows.result }}
          SMOKE: ${{ needs.package.result }}
        run: |
          echo "Job results: $RESULTS"
          node -e "const e=process.env; const want=(required,result)=>result===(required?'success':'skipped'); if(e.SCOPE_RESULT!=='success'||!want(e.RUNTIME==='true'||e.PACKAGE==='true',e.CHECKS)||[e.TESTS,e.WINDOWS,e.SMOKE].some(r=>!want(e.RUNTIME==='true',r)))process.exit(1)"
