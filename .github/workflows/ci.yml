name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
  workflow_dispatch:
    inputs:
      full:
        description: Run every suite and package smoke test
        type: boolean
        default: true
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
      package_version:
        description: Runner-only version for a gated preview archive
        type: string
        required: false
        default: ''
      full:
        description: Run every suite (release callers always use the full gate)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  FORCE_COLOR: '1'
  NPM_CONFIG_FUND: 'false'
jobs:
  changes:
    name: Change scope and commit convention
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      package: ${{ steps.scope.outputs.package }}
      dependencies: ${{ steps.scope.outputs.dependencies }}
      quality: ${{ steps.scope.outputs.quality }}
      lense: ${{ steps.scope.outputs.lense }}
      mirage: ${{ steps.scope.outputs.mirage }}
      examples: ${{ steps.scope.outputs.examples }}
      smoke: ${{ steps.scope.outputs.smoke }}
      site: ${{ steps.scope.outputs.site }}
      full: ${{ steps.scope.outputs.full }}
      units: ${{ steps.scope.outputs.units }}
      browsers: ${{ steps.scope.outputs.browsers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Validate the squash commit title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/conventional-commit.mjs --title
      - name: Classify changes
        id: scope
        env:
          VALIDATE_ALL: ${{ inputs.full == true || inputs.ref != '' }}
        run: node .github/scripts/change-scope.mjs
  checks:
    needs: changes
    if: needs.changes.outputs.quality == 'true' || needs.changes.outputs.package == 'true'
    name: Static checks and release boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            npm-shrinkwrap.json
            mirage/package-lock.json
      - name: Stamp preview package metadata
        if: inputs.package_version != ''
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: node scripts/release-version.mjs stamp
      - name: Install locked dependencies
        run: npm run ci:prepare -- --quality
      - name: Check formatting, lint and workflows
        if: needs.changes.outputs.quality == 'true'
        run: npm run quality
      - name: Check module syntax and project boundary
        if: needs.changes.outputs.runtime == 'true'
        run: npm run check
      - name: Build the documentation site
        if: needs.changes.outputs.site == 'true'
        run: npm run site:build
      - name: Validate distributable files, lockfiles and documentation
        if: needs.changes.outputs.package == 'true'
        run: npm run release:check
      - name: Audit every locked package
        if: needs.changes.outputs.dependencies == 'true'
        run: npm run audit:dependencies
      - name: Verify registry signatures of installed packages
        if: needs.changes.outputs.dependencies == 'true'
        run: |-
          npm audit signatures
          npm audit signatures --prefix mirage
  test:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    name: Unit tests (Node 24, ${{ matrix.suite }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.units) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            npm-shrinkwrap.json
            mirage/package-lock.json
      - name: Stamp preview package metadata
        if: inputs.package_version != ''
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: node scripts/release-version.mjs stamp
      - name: Disable Git auto-maintenance
        run: |-
          git config --global maintenance.auto false
          git config --global gc.auto 0
      - name: Install the pinned .NET SDK
        if: matrix.suite != 'lense'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Prepare the selected suite
        run: npm run ci:prepare -- --suite ${{ matrix.suite }} --unit ${{ matrix.shard && format('--shard {0}', matrix.shard) || '' }}
      - name: Verify the selected suite
        run: npm run ci:verify -- --suite ${{ matrix.suite }} --unit --prepared ${{ matrix.shard && format('--shard {0}', matrix.shard) || '' }}
  browser:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    name: Browser tests (Node 24, ${{ matrix.suite }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.browsers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            npm-shrinkwrap.json
            mirage/package-lock.json
      - name: Stamp preview package metadata
        if: inputs.package_version != ''
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: node scripts/release-version.mjs stamp
      - name: Disable Git auto-maintenance
        run: |-
          git config --global maintenance.auto false
          git config --global gc.auto 0
      - name: Read locked browser version
        id: playwright
        run: echo "version=$(node -p "require('./package.json').dependencies['playwright-core']")" >> "$GITHUB_OUTPUT"
      - name: Restore matching Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the pinned .NET SDK
        if: matrix.suite != 'lense'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Prepare the selected suite
        run: npm run ci:prepare -- --suite ${{ matrix.suite }} --browser ${{ matrix.shard && format('--shard {0}', matrix.shard) || '' }}
      - name: Verify the selected suite
        run: npm run ci:verify -- --suite ${{ matrix.suite }} --browser --prepared ${{ matrix.shard && format('--shard {0}', matrix.shard) || '' }}
      - name: Collect only synthetic evidence
        if: always()
        run: node scripts/collect-evidence.mjs
      - name: Preserve synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-evidence-${{ matrix.suite }}-${{ strategy.job-index }}
          path: .paqvilo/ci-evidence-*/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
  windows:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    name: Windows unit tests (Node 24, ${{ matrix.suite }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: windows-2025
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.units) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            npm-shrinkwrap.json
            mirage/package-lock.json
      - name: Stamp preview package metadata
        if: inputs.package_version != ''
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: node scripts/release-version.mjs stamp
      - name: Disable Git auto-maintenance
        run: |-
          git config --global maintenance.auto false
          git config --global gc.auto 0
      - name: Install the pinned .NET SDK
        if: matrix.suite != 'lense'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      # The full SDK client gate runs once, beside the first Mirage shard.
      - name: Prepare the selected suite
        run: npm run ci:prepare -- --suite ${{ matrix.suite }} --unit ${{ matrix.shard && format('--shard {0}', matrix.shard) || '' }} ${{ matrix.suite == 'mirage' && (!matrix.shard || startsWith(matrix.shard, '1/')) && needs.changes.outputs.full == 'true' && '--sdk' || '' }}
      - name: Verify the selected suite
        run: npm run ci:verify -- --suite ${{ matrix.suite }} --unit --prepared ${{ matrix.shard && format('--shard {0}', matrix.shard) || '' }}
      - name: Verify the full Windows SDK clients
        if: matrix.suite == 'mirage' && (!matrix.shard || startsWith(matrix.shard, '1/')) && needs.changes.outputs.full == 'true'
        run: node scripts/ci.mjs sdk
  package:
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    name: Package smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            npm-shrinkwrap.json
            mirage/package-lock.json
      - name: Stamp preview package metadata
        if: inputs.package_version != ''
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: node scripts/release-version.mjs stamp
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Prime npm cache for the offline install
        run: npm run cache:package
      - name: Install matching Chromium
        run: node scripts/ci.mjs browser
      - name: Install the packed distribution into the example project
        run: npm run release:smoke
        env:
          PAQVILO_BROWSER: chromium
      - name: Pack distributable
        run: mkdir -p dist && npm pack --ignore-scripts --pack-destination dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: package
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 14
  gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - checks
      - test
      - browser
      - windows
      - package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          QUALITY: ${{ needs.changes.outputs.quality }}
          PACKAGE: ${{ needs.changes.outputs.package }}
          RUNTIME: ${{ needs.changes.outputs.runtime }}
          SMOKE_REQUIRED: ${{ needs.changes.outputs.smoke }}
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.test.result }}
          BROWSER: ${{ needs.browser.result }}
          WINDOWS: ${{ needs.windows.result }}
          SMOKE: ${{ needs.package.result }}
        run: node -e "const e=process.env; const want=(required,result)=>result===(required?'success':'skipped'); if(e.SCOPE_RESULT!=='success'||!want(e.QUALITY==='true'||e.PACKAGE==='true',e.CHECKS)||[e.TESTS,e.BROWSER,e.WINDOWS].some(r=>!want(e.RUNTIME==='true',r))||!want(e.SMOKE_REQUIRED==='true',e.SMOKE))process.exit(1)"
