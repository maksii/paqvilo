name: Release

# Publishing is explicit: push a tag matching package.json ("v1.2.0"), or run manually with a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (for example v1.2.0)
        required: true
      dry_run:
        description: Run every gate and npm publish --dry-run without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    name: Gates
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}

  publish:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/paqvilo
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance and trusted publishing
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package version
        id: version
        run: |
          # Publishing a tag must never bypass the protected source branch.
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tag must point to a commit on main"
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"
          # A re-run after a later step failed must not try to publish the same version twice.
          if [ "$(npm view "paqvilo@$version" version 2>/dev/null)" = "$version" ]; then
            echo "::notice::paqvilo@$version is already on npm; skipping publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Pack distributable
        # Contributor setup scripts stay out of the consumer install lifecycle.
        run: mkdir -p dist && npm pack --ignore-scripts --pack-destination dist
      - name: Publish
        if: steps.version.outputs.published != 'true'
        env:
          # Optional: an npm automation token. Without it, npm trusted publishing (OIDC) is used.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # "./" keeps npm from reading dist/<file> as GitHub owner/repo shorthand.
          args=(publish "./dist/paqvilo-${{ steps.version.outputs.version }}.tgz" --provenance --access public --tag "${{ steps.version.outputs.dist-tag }}" --ignore-scripts)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          npm "${args[@]}"
      - name: Create GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [ "${{ steps.version.outputs.dist-tag }}" = "next" ]; then prerelease=(--prerelease); fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::GitHub release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" dist/*.tgz --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag "${prerelease[@]}"
