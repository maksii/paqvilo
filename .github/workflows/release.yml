name: Release
on:
  push:
    tags:
      - v*
      - '!v*-preview.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable or generated preview tag (run the workflow on this tag)
        required: true
      dry_run:
        description: Run every gate and npm publish --dry-run without publishing
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  plan:
    name: Resolve immutable release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      distTag: ${{ steps.plan.outputs.distTag }}
      sha: ${{ steps.plan.outputs.sha }}
      preview: ${{ steps.plan.outputs.preview }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Validate tag and main or preview provenance
        id: plan
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node scripts/release-version.mjs plan
  ci:
    name: Gates
    needs: plan
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
      package_version: ${{ needs.plan.outputs.preview == 'true' && needs.plan.outputs.version || '' }}
      full: true
  publish:
    name: Publish to npm
    needs:
      - plan
      - ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/paqvilo
    concurrency:
      group: npm-${{ needs.plan.outputs.distTag }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      PACKAGE_VERSION: ${{ needs.plan.outputs.version }}
      DIST_TAG: ${{ needs.plan.outputs.distTag }}
      PREVIEW: ${{ needs.plan.outputs.preview }}
      SOURCE_SHA: ${{ needs.plan.outputs.sha }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - name: Download the archive built and tested by Gates
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: package
          path: dist
      - name: Verify gated archive metadata
        run: node scripts/release-version.mjs verify
      - name: Check already-published version
        id: registry
        run: |
          if [ "$(npm view "paqvilo@$PACKAGE_VERSION" version 2>/dev/null)" = "$PACKAGE_VERSION" ]; then
            echo "::notice::paqvilo@$PACKAGE_VERSION already exists; skipping publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish gated archive
        if: steps.registry.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          args=(publish "./dist/paqvilo-$PACKAGE_VERSION.tgz" --provenance --access public --tag "$DIST_TAG" --ignore-scripts)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          npm "${args[@]}"
      - name: Record installation instructions
        run: |
          {
            echo "Package: \`paqvilo@$PACKAGE_VERSION\`"
            echo "Source commit: \`$SOURCE_SHA\`"
            echo "npm tag: \`$DIST_TAG\`; dry run: \`$DRY_RUN\`"
            echo ''
            echo 'After a successful publish, install the exact version:'
            echo "\`npm install --save-dev --save-exact paqvilo@$PACKAGE_VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create stable GitHub release
        if: env.DRY_RUN != 'true' && env.PREVIEW != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [ "$DIST_TAG" = "next" ]; then prerelease=(--prerelease); fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::GitHub release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" dist/*.tgz --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag "${prerelease[@]}"
