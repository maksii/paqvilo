name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '19 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      dependencies: ${{ steps.scope.outputs.dependencies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        run: node .github/scripts/change-scope.mjs

  dependency-review:
    name: Dependency review
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions, csharp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: /language:${{ matrix.language }}
          wait-for-processing: true

  gate:
    name: Security gate
    if: always()
    needs: [changes, dependency-review, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Require applicable security jobs
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          RUNTIME: ${{ needs.changes.outputs.runtime }}
          DEPENDENCIES: ${{ needs.changes.outputs.dependencies }}
          REVIEW: ${{ needs.dependency-review.result }}
          CODEQL: ${{ needs.codeql.result }}
          EVENT: ${{ github.event_name }}
        run: |
          node -e "const e=process.env;const want=(required,result)=>result===(required?'success':'skipped');if(e.SCOPE_RESULT!=='success'||!want(e.RUNTIME==='true',e.CODEQL)||!want(e.EVENT==='pull_request'&&e.DEPENDENCIES==='true',e.REVIEW))process.exit(1)"
      - name: Require no open CodeQL findings
        if: needs.changes.outputs.runtime == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          open_alert_count="$(gh api --method GET "repos/${GITHUB_REPOSITORY:?Repository is required}/code-scanning/alerts" -f "ref=${GITHUB_REF:?Analyzed ref is required}" -f state=open -f tool_name=CodeQL -F per_page=1 --jq 'if type == "array" then length else error("Unexpected code scanning response") end')"
          if [ "$open_alert_count" != "0" ]; then
            echo "::error::CodeQL has open findings for the analyzed ref. Review the code scanning results."
            exit 1
          fi
