# SonarQube analysis (https://sonar.maksii.com, project "paqvilo"). CI: .github/workflows/sonarqube.yml.
# Scope mirrors .prettierignore and the ESLint ignores: toolkit-owned sources and tests only, never
# exported portal/solution content, fixtures, generated or bundled files.
sonar.projectKey=paqvilo
sonar.projectName=Paqvilo
sonar.sourceEncoding=UTF-8
sonar.javascript.node.maxspace=8192
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=test/**,test-browser/**,mirage/test/**,mirage/test-browser/**,mirage/test-sdk/**,mirage/test-volume/**,examples/**/test/**
sonar.exclusions=test/**,test-browser/**,mirage/test/**,mirage/test-browser/**,mirage/test-sdk/**,mirage/test-volume/**,examples/**/test/**,\
  **/node_modules/**,**/dist/**,**/coverage/**,**/fixtures/**,**/generated/**,**/bin/Release/**,**/obj/**,**/out/**,\
  **/*.min.js,**/bundle.js,**/*.cs,licenses/**,site/media/**,docs/assets/**,\
  examples/project/baseline/portal/**,examples/project/baseline/solution/**,examples/project/portal/**,\
  examples/project/solution/**,examples/project/code-site/**,examples/project/code-solution/**,\
  .paqvilo/**,artifacts/**,metrics/**,logs/**,tmp/**
# mirage/test/parity-replay.test.mjs registers one test per recorded case through replayParityDirectory, so the
# empty-test-file rule cannot see them. The exclusion covers that rule on that file only.
sonar.issue.ignore.multicriteria=replayRunner
sonar.issue.ignore.multicriteria.replayRunner.ruleKey=javascript:S2187
sonar.issue.ignore.multicriteria.replayRunner.resourceKey=mirage/test/parity-replay.test.mjs
